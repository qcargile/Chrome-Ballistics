Attacks.jack2_fullautomode:
    $base: Attacks.Bullet_GameEffect
    explosionAttack:
        $base: Attacks.Bullet_GameEffect
        playerIncomingDamageMultiplier: 0.20
        effectName: weaponShoot
        effectTag: player_ray
        range: 20.0
        statModifiers:
        -   $type: CombinedStatModifier
            refStat: BaseStats.DamagePerHit
            statType: BaseStats.ElectricDamage
            modifierType: Additive
            refObject: Owner
            value: 500.0
        hitFlags:
        -   !append-once Explosion
        hitReactionSeverityMin: 2
        explosionDamageVSVehicles: 5.0
        statusEffects:
        -   $type: StatusEffectAttackData
            statusEffect: BaseStatusEffect.Stun
            resistPool: BaseStatPools.StunTrigger
            applyImmediately: true
            

Attacks.jack2attack1:
    $type: RangedAttack
    playerAttack: Attacks.jack2_fullautomode
    playerTimeDilated: Attacks.jack2_fullautomode

Attacks.jack2attacks:
    $type: RangedAttackPackage
    defaultFire: Attacks.jack2attack1
  

  
  
  
  