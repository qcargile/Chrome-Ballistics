  statType: BaseStats.MaximumRange

  
Attacks.m76_fullautomode:
    $base: Attacks.Bullet_GameEffect
    statusEffects:
    -   $type: StatusEffectAttackData
        statusEffect:
            $base: BaseStatusEffect.Vulnerable
            maxStacks:
                statModifiers:
                -   $type: ConstantStatModifier
                    statType: BaseStats.MaxStacks
                    modifierType: Additive
                    value: 5.0
            reapplyPackagesOnMaxStacks: false
            removeAllStacksWhenDurationEnds: false
            packages:
            -   $base: BaseStatusEffect.Vulnerable_inline2
                stackable: true
        resistPool: BaseStatPools.BurningTrigger
        applyImmediately: true

Attacks.m76_semiautomode:
    $base: Attacks.Bullet_GameEffect
    statusEffects:
    -   $type: StatusEffectAttackData
        statusEffect:
            $base: BaseStatusEffect.Vulnerable
            maxStacks:
                statModifiers:
                -   $type: ConstantStatModifier
                    statType: BaseStats.MaxStacks
                    modifierType: Additive
                    value: 5.0
            reapplyPackagesOnMaxStacks: false
            removeAllStacksWhenDurationEnds: false
            packages:
            -   $base: BaseStatusEffect.Vulnerable_inline2
                stackable: true
        resistPool: BaseStatPools.BurningTrigger
        applyImmediately: true
            

Attacks.m76attack1:
    $type: RangedAttack
    playerAttack: Attacks.m76_fullautomode
    secondaryPlayerAttack: Attacks.m76_fullautomode
    playerTimeDilated: Attacks.m76_fullautomode
    secondaryPlayerTimeDilated: Attacks.m76_fullautomode

Attacks.m76attacks:
    $type: RangedAttackPackage
    defaultFire: Attacks.m76attack1
    chargeFire: Attacks.m76attack1


  