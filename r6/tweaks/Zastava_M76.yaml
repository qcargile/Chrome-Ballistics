  itemPartPreset: Items.m76_mag_stdr_prt
  
Items.m76stats_rof:
  $type: gamedataConstantStatModifier_Record
  value: -0.05
  modifierType: Additive
  statType: BaseStats.CycleTimeBase
  
Items.m76stats_damage:
  $type: gamedataConstantStatModifier_Record
  value: 105
  modifierType: Additive
  statType: BaseStats.DPS
  
Items.m76stats_reload:
  $type: gamedataConstantStatModifier_Record
  value: -0.50
  modifierType: Additive
  statType: BaseStats.EmptyReloadTime
  
Items.m76stats_reload2:
  $type: gamedataConstantStatModifier_Record
  value: -0.50
  modifierType: Additive
  statType: BaseStats.ReloadTimeBase
  
Items.m76stats_recoil2:
  $type: gamedataConstantStatModifier_Record
  value: 0.35
  modifierType: Additive
  statType: BaseStats.RecoilRecoveryTime

Items.m76stats_equip:
  $type: gamedataConstantStatModifier_Record
  value: -1.0
  modifierType: Additive
  statType: BaseStats.EquipDuration_First
  
Items.m76stats_mag:
