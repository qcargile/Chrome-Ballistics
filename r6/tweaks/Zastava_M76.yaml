Items.Zastava_M76:
  $base: Items.Preset_Ajax_Default
  tags:
    - !append-once IconicWeapon 
  statModifiers: 
    - !append-once Quality.IconicItem
    - !append-once Items.m76stats_rof 
    - !append-once Items.m76stats_damage
    - !append-once Items.m76stats_reload  
    - !append-once Items.m76stats_recoil2
    - !append-once Items.m76stats_reload2  
    - !append-once Items.m76stats_equip
    - !append-once Items.m76stats_mag
    - !append-once Items.m76stats_spread
    - !append-once Items.m76stats_spread2
    - !append-once Items.m76stats_spread3
    - !append-once Items.m76stats_armor
    - !append-once Items.m76stats_headshotmult
    - !append-once Items.m76stats_effectiverange
    - !append-once Items.m76stats_maxrange
  appearanceResourceName: m76_app
  audioName: wea_set_kyubi
  primaryTriggerMode: TriggerMode.Charge
  secondaryTriggerMode: TriggerMode.Charge
  triggerModes:
    - TriggerMode.Charge
    - TriggerMode.Charge
  attacks:
    - !append-once Attacks.m76_fullautomode
    - !append-once Attacks.m76_semiautomode
  rangedAttacks: Attacks.m76attacks
  quality: Quality.Epic
  displayName: m76_name
  localizedDescription: m76_description
  visualTags:
    - Default
  hudIcon:
    atlasResourcePath: m76\icon\m76_hud.inkatlas
    atlasPartName: slot_01
  icon:  
    atlasResourcePath: m76\icon\m76.inkatlas
    atlasPartName: slot_01
  slotPartList:
    - Items.Base_m76_inline2
    - Items.Base_m76_inline4
    - Items.Base_m76_inline6
    - Items.Base_m76_inline8
    - Items.RangedWeaponPossibleMuzzleList
    - Items.RiflePossibleMuzzleBrakeList
    - Items.HandgunPossibleScopesList
    - Items.GradPossibleScopesList
    - Items.NekomataPossibleScopesList
  slotPartListPreset:
    - Items.Preset_m76_inline0
    - Items.Preset_m76_inline1
    - Items.Preset_m76_inline2
    - Items.Preset_m76_inline3
  
Items.Base_m76_inline2:
  $base: Items.Base_Ajax_inline2
  itemPartList:
    - Items.Base_m76_inline3
Items.Base_m76_inline3:
  $base: Items.Base_Ajax_inline3
  item: Items.m76_rcv_prt
