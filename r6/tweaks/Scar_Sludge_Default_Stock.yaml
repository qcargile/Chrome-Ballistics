Items.sludge2stats_damage:
  $type: gamedataConstantStatModifier_Record
  value: -25
  modifierType: Additive
  statType: BaseStats.DPS
  
Items.sludge2stats_rof:
  $type: gamedataConstantStatModifier_Record
  value: 0.03
  modifierType: Additive
  statType: BaseStats.CycleTimeBase
  
Items.sludge2stats_mag:
  $type: gamedataConstantStatModifier_Record
  value: -10
  modifierType: Additive
  statType: BaseStats.MagazineCapacityBase
  
Items.sludge2stats_chemical:
  $type: gamedataConstantStatModifier_Record
  value: 85
  modifierType: Additive
  statType: BaseStats.ChemicalDamage
   
  
Attacks.sludge2_fullautomode:
    $base: Attacks.PoisonBulletEffect
    explosionAttack:
        $base: Attacks.ChemicalBulletEffect
        playerIncomingDamageMultiplier: 0.20
        effectName: weaponShoot
        effectTag: player_ray
        range: 100.0
        statModifiers:
        -   $type: CombinedStatModifier
            refStat: BaseStats.DamagePerHit
            statType: BaseStats.ChemicalDamage
            modifierType: Additive
            refObject: Owner
            value: 500.0
        hitFlags:
        -   !append-once Explosion
        hitReactionSeverityMin: 2
        explosionDamageVSVehicles: 5.0
        statusEffects:
        -   $type: StatusEffectAttackData
            statusEffect: BaseStatusEffect.Poisoned
            resistPool: BaseStatPools.PoisonTrigger
            applyImmediately: true
            

Attacks.sludge2attack1:
    $type: RangedAttack
    playerAttack: Attacks.sludge2_fullautomode
    playerTimeDilated: Attacks.sludge2_fullautomode

Attacks.sludge2attacks:
    $type: RangedAttackPackage
    defaultFire: Attacks.sludge2attack1
  
  
  

  
  
  
  
  