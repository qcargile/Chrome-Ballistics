  appearanceResourceName: reboot_app
  blueprint: Items.Base_Power_Shotgun_Blueprint
  fxPackage: WeaponFxPackage.PowerLargeCaliber
  hudIcon:
    atlasResourcePath: reboot\icon\reboot_hud.inkatlas
    atlasPartName: slot_01
  icon:  
    atlasResourcePath: reboot\icon\reboot.inkatlas
    atlasPartName: slot_01
  quality: Quality.Legendary
  displayName: reboot_name
  localizedDescription: reboot_description
  slotPartList:
    - Items.Base_reboot_inline2
    - Items.Base_reboot_inline4
    - Items.Base_reboot_inline6
    - Items.Base_reboot_inline8
    - Items.RangedWeaponPossibleMuzzleList
    - Items.RiflePossibleMuzzleBrakeList
    - Items.HandgunPossibleScopesList
    - Items.RiflePossibleScopesList
    - Items.UniversalShotgunSuppressorList
  slotPartListPreset:
    - Items.Preset_reboot_inline0
    - Items.Preset_reboot_inline1
    - Items.Preset_reboot_inline2
    - Items.Preset_reboot_inline3
  visualTags:
    - Default
    
