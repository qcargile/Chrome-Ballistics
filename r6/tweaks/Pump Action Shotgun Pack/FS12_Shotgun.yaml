Items.FS12_Shotgun:
  $base: Items.Preset_Tactician_Default
  tags:
    - !append ForceDismember
    - !append-once IconicWeapon  
  statModifiers: 
    - !append-once Quality.IconicItem 
    - !append-once Items.fs12stats_damage
    - !append-once Items.fs12stats_rof
    - !append-once Items.fs12stats_spread
    - !append-once Items.fs12stats_mag
    - !append-once Items.fs12stats_pierce
    - !append-once Items.fs12stats_armor
    - !append-once Items.fs12stats_crit
    - !append-once Items.fs12stats_bleeding
    - !append-once Items.fs12stats_burning
    - !append-once Items.fs12stats_electrocute
    - !append-once Items.fs12stats_poison
    - !append-once Items.fs12stats_stun
    - !append-once Items.fs12stats_headshotmult
    - !append-once Items.fs12stats_effectiverange
    - !append-once Items.fs12stats_maxrange
  statModifierGroups: 
    - !remove Items.IconicQualityRandomization
    - !remove Items.QualityRandomization
    - !remove Items.ItemPlusRandomizer_MaxQuality
    - !remove Items.ItemPlusRandomizer_Below_MaxQuality
  ammo: Ammo.ShotgunAmmo
  appearanceResourceName: fs12_app
  blueprint: Items.Base_Power_Shotgun_Blueprint
  fxPackage: WeaponFxPackage.PowerLargeCaliber
  hudIcon:
    atlasResourcePath: fs12\icon\fs12_hud.inkatlas
    atlasPartName: slot_01
  icon:  
    atlasResourcePath: fs12\icon\fs12.inkatlas
    atlasPartName: slot_01
  quality: Quality.Rare
  displayName: fs12_name
  localizedDescription: fs12_description
  slotPartList:
    - Items.Base_fs12_inline2
    - Items.Base_fs12_inline4
    - Items.Base_fs12_inline6
    - Items.Base_fs12_inline8
    - Items.RangedWeaponPossibleMuzzleList
    - Items.RiflePossibleMuzzleBrakeList
    - Items.HandgunPossibleScopesList
    - Items.RiflePossibleScopesList
    - Items.UniversalShotgunSuppressorList
  slotPartListPreset:
    - Items.Preset_fs12_inline0
    - Items.Preset_fs12_inline1
    - Items.Preset_fs12_inline2
    - Items.Preset_fs12_inline3
  visualTags:
    - Default
    
