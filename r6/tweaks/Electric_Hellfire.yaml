Items.el_hf_stats_mag:
  $type: gamedataConstantStatModifier_Record
  value: 5
  modifierType: Additive
  statType: BaseStats.MagazineCapacityBase
  
Items.el_hf_stats_damage:
  $type: gamedataConstantStatModifier_Record
  value: -60
  modifierType: Additive
  statType: BaseStats.DPS
  
Items.el_hf_stats_rof:
  $type: gamedataConstantStatModifier_Record
  value: -0.05
  modifierType: Additive
  statType: BaseStats.CycleTimeBase
 
Attacks.el_hf_fullautomode:
    $base: Attacks.Bullet_GameEffect
    explosionAttack:
        $base: Attacks.EMPBrick
        playerIncomingDamageMultiplier: 0.20
        effectName: ep1_explosions
        effectTag: breach_emp_explosion
        range: 10.0
        statModifiers:
        -   $type: CombinedStatModifier
            refStat: BaseStats.DamagePerHit
            statType: BaseStats.ElectricDamage
            modifierType: Additive
            refObject: Owner
            value: 3.0
        hitFlags:
        -   !append-once EMPGrenade
        -   !append-once PlayerEMPGrenadeDOTOverride
        hitReactionSeverityMin: 2
        explosionDamageVSVehicles: 20.0
        statusEffects:
        -   $type: StatusEffectAttackData
            statusEffect: BaseStatusEffect.Electrocuted
            resistPool: BaseStatPools.ElectrocutedTrigger
            applyImmediately: true           

Attacks.el_hf_semiautomode:
    $base: Attacks.Bullet_GameEffect
    explosionAttack:
        $base: Attacks.IncendiaryGrenade
        playerIncomingDamageMultiplier: 0.20
        effectName: explosions
        effectTag: incendiary_explosion
        range: 10.0
        statModifiers:
        -   $type: CombinedStatModifier
            refStat: BaseStats.DamagePerHit
            statType: BaseStats.ThermalDamage
            modifierType: Additive
            refObject: Owner
            value: 3.0
        hitFlags:
        -   !append-once DeviceExplosionAttack
        -   !append-once DetonateGrenades
        -   !append-once BulletExplosion
        hitReactionSeverityMin: 2
        explosionDamageVSVehicles: 20.0
        statusEffects:
        -   $type: StatusEffectAttackData
            statusEffect: BaseStatusEffect.EpicBurnGrenade
            resistPool: BaseStatPools.BurningTrigger
            applyImmediately: true
            

Attacks.el_hf_attack1:
    $type: RangedAttack
    playerAttack: Attacks.el_hf_semiautomode
    secondaryPlayerAttack: Attacks.el_hf_fullautomode
    playerTimeDilated: Attacks.el_hf_semiautomode
    secondaryPlayerTimeDilated: Attacks.el_hf_fullautomode

Attacks.el_hf_attacks:
    $type: RangedAttackPackage
    defaultFire: Attacks.el_hf_attack1
    chargeFire: Attacks.el_hf_attack1
   
   
WeaponFxPackage.el_hf_effects:
    $base: WeaponFxPackage.PowerRifleAssault
    vfx_hitscan_trail: base\fx\weapons\trails\power\thermal\w_trail_thermal_power_hmg.effect
    NPC_vfx_hitscan_trail: base\fx\weapons\trails\power\thermal\w_trail_thermal_power_hmg.effect
    vfx_hitscan_trail_slowmo: base\fx\weapons\trails\power\thermal\w_trail_thermal_power_hmg.effect
    vfx_hitscan_trail_ricochet: base\fx\weapons\trails\power\thermal\w_trail_thermal_power_hmg.effect
    vfx_impact_damage_thermal: base\fx\weapons\impacts\_elemental\thermal\imp_add_on_thermal.effect

 


 