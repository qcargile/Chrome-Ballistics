    - !append-once IconicWeapon
  statModifiers: 
    - !append-once Quality.IconicItem 
    - !append-once Items.onistats_damage
    - !append-once Items.onistats_rof
    - !append-once Items.onistats_mag
    - !append-once Items.onistats_hiplock
    - !append-once Items.onistats_hiptargets
    - !append-once Items.onistats_adslock
    - !append-once Items.onistats_adstargets
