# Weapon stats
Items.hcar3stats_damage:
  $type: gamedataConstantStatModifier_Record
  value: -35                                           #CHANGE DAMAGE VALUE - LOWER NUMBER=LOWER DAMAGE, HIGHER NUMBER=HIGHER DAMAGE.
  modifierType: Additive
  statType: BaseStats.DPS
  
Items.hcar3stats_rof:
  $type: gamedataConstantStatModifier_Record
  value: 0.01                                        #CHANGE RATE OF FIRE- HIGHER NUMBER=LOWER ROF, LOWER NUMBER=HIGHER ROF (TRY TO KEEP THIS VALUE BETWEEN "-0.10" AND "0.10")
  modifierType: Additive
  statType: BaseStats.CycleTimeBase
  
Items.hcar3stats_mag:
  $type: gamedataConstantStatModifier_Record
  value: -10                                            #CHANGE MAG CAPACITY - 0=DEFAULT (30 ROUNDS)  EXAMPLE: IF YOU WANT 45 ROUNDS YOU WOULD PUT "15" AS THE VALUE
  modifierType: Additive
  statType: BaseStats.MagazineCapacityBase
  
Items.hcar3stats_pierce:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #ENABLE/DISABLE WEAPON PIERCE - 0=DISABLED, 1=ENABLED
  modifierType: Additive
  statType: BaseStats.TechPierceEnabled
  
Items.hcar3stats_crit:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE CRIT CHANCE - THE NUMBER YOU INPUT WILL BE THE CRIT CHANCE PERCENTAGE
  modifierType: Additive
  statType: BaseStats.CritChance
  
Items.hcar3stats_stun:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE STUN CHANCE - THE NUMBER YOU INPUT WILL BE THE STUN CHANCE PERCENTAGE
  modifierType: Additive
  statType: BaseStats.StunApplicationRate
  
Items.hcar3stats_poison:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE POISON CHANCE - THE NUMBER YOU INPUT WILL BE THE POISON CHANCE PERCENTAGE
  modifierType: Additive
  statType: BaseStats.PoisonedApplicationRate
  
Items.hcar3stats_electrocute:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE ELECTROCUTE CHANCE - THE NUMBER YOU INPUT WILL BE THE ELECTROCUTE CHANCE PERCENTAGE
  modifierType: Additive
  statType: BaseStats.ElectrocutedApplicationRate
  
Items.hcar3stats_bleeding:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE BLEEDING CHANCE - THE NUMBER YOU INPUT WILL BE THE BLEEDING CHANCE PERCENTAGE
  modifierType: Additive
  statType: BaseStats.BleedingApplicationRate
  
Items.hcar3stats_burning:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE BURNING CHANCE - THE NUMBER YOU INPUT WILL BE THE BURNING CHANCE PERCENTAGE
  modifierType: Additive
  statType: BaseStats.BurningApplicationRate
  
Items.hcar3stats_headshotmult:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE HEADSHOT DAMAGE PERCENTAGE - 0=DEFAULT (125% Headshot Damage)  EXAMPLE: "-1.25=0%",  "-1=25%",  "-0.5=75%",  "0=125%",  "1=225%",  "2=325%",  "3=425%"
  modifierType: Additive
  statType: BaseStats.HeadshotDamageMultiplier

Items.hcar3stats_spread:
  $type: gamedataConstantStatModifier_Record
  value: -1                                            #ENABLE/DISABLE ADS BULLET SPREAD - "-1=DISABLED",  "0=ENABLED"  ONLY AFFECTS BULLET SPREAD WHILE AIMING
  modifierType: Additive
  statType: BaseStats.SpreadUseInAds
  
Items.hcar3stats_maxrange:
  $type: gamedataConstantStatModifier_Record
  value: 40
  modifierType: Additive
  statType: BaseStats.MaximumRange
  
Items.hcar3stats_effectiverange:
  $type: gamedataConstantStatModifier_Record
  value: 40
  modifierType: Additive
  statType: BaseStats.EffectiveRange
  
Items.hcar3stats_equip:
  $type: gamedataConstantStatModifier_Record
  value: 1.40
  modifierType: Additive
  statType: BaseStats.EquipDuration_First
  
Items.hcar3stats_armor:
  $type: gamedataConstantStatModifier_Record
  value: 0.75
  modifierType: Additive
  statType: BaseStats.CanWeaponIgnoreArmor
 



