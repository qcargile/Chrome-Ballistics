Items.Desolator:
  $base: Items.Preset_Nue_Default
  tags:
    - !append-once IconicWeapon
    - !append-once Silenced
  statModifiers: 
    - !append-once Quality.IconicItem 
    - !append-once Items.des50stats_damage
    - !append-once Items.des50stats_rof
    - !append-once Items.des50stats_mag
    - !append-once Items.des50stats_armor
