  appearanceResourceName: des50_app
  forcedMinHitReaction: 50
  quality: Quality.Epic
  displayName: des50_name
  localizedDescription: des50_description
  visualTags:
   - Default
  hudIcon:
    atlasResourcePath: des50\icon\des50_hud.inkatlas
    atlasPartName: slot_01
