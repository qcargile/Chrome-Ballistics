Items.Flatline:
  $base: Items.Preset_Pulsar_Default
  tags:
    - !append-once IconicWeapon 
  statModifiers: 
    - !append-once Quality.IconicItem 
    - !append-once Items.flatlinestats_damage
    - !append-once Items.flatlinestats_mag
    - !append-once Items.flatlinestats_rof
    - !append-once Items.flatlinestats_armor
  appearanceResourceName: flatline_app
  ammo: Ammo.RifleAmmo
  audioName: wea_set_ajax
  quality: Quality.Epic
  displayName: flatline_name
  itemType: ItemType.Wea_SubmachineGun
  ammo: Ammo.RifleAmmo
  localizedDescription: flatline_description
  visualTags:
   - Default
  hudIcon:
    atlasResourcePath: flatline\icon\flatline_hud.inkatlas
    atlasPartName: slot_01
  icon:  
    atlasResourcePath: flatline\icon\flatline.inkatlas
    atlasPartName: slot_01
  slotPartList:
    - Items.Base_flatline_inline1
    - Items.Base_flatline_inline3
    - Items.Base_flatline_inline5
    - Items.Base_flatline_inline7
    - Items.HandgunPossibleScopesList
    - Items.RangedWeaponPossibleMuzzleList
    - Items.RiflePossibleMuzzleBrakeList
    - Items.GradPossibleScopesList
    - Items.NekomataPossibleScopesList
    - Items.RiflePossibleScopesList
  slotPartListPreset:
    - Items.Preset_flatline_inline0
    - Items.Preset_flatline_inline1
    - Items.Preset_flatline_inline2
    - Items.Preset_flatline_inline3
    
Items.Base_flatline_inline1:
  $base: Items.Base_Pulsar_inline1
  itemPartList:
    - Items.Base_flatline_inline2
Items.Base_flatline_inline2:
