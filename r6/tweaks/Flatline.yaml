Items.flatline_rcv_prt:
  $base: Items.w_submachinegun__darra_pulsar__rcv1
  appearanceResourceName: flatline_rcv
#base
Items.Base_flatline_inline3:
  $base: Items.Base_Pulsar_inline3
  itemPartList:
    - Items.Base_flatline_inline4
Items.Base_flatline_inline4:
  $base: Items.Base_Pulsar_inline4
  item: Items.flatline_base_prt
Items.flatline_base_prt:
  $base: Items.w_submachinegun__darra_pulsar__base1
  appearanceResourceName: flatline_base
#mag
Items.Base_flatline_inline5:
  $base: Items.Base_Pulsar_inline5
  itemPartList:
    - Items.Base_flatline_inline6
Items.Base_flatline_inline6:
  $base: Items.Base_Pulsar_inline6
  item: Items.flatline_mag_std_prt
Items.flatline_mag_std_prt:
  $base: Items.w_submachinegun__darra_pulsar__mag_std
  appearanceResourceName: flatline_mag_std
#reload
Items.Base_flatline_inline7:
  $base: Items.Base_Pulsar_inline7
  itemPartList:
    - Items.Base_flatline_inline8
Items.Base_flatline_inline8:
  $base: Items.Base_Pulsar_inline8
  item: Items.flatline_mag_stdr_prt
Items.flatline_mag_stdr_prt:
  $base: Items.w_submachinegun__darra_pulsar__mag_stdr
