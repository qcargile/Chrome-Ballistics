Items.OTs14_Groza:
  $base: Items.Preset_Pulsar_Default
  tags:
    - !append-once IconicWeapon 
  statModifiers: 
    - !append-once Quality.IconicItem 
    - !append-once Items.otsstats_damage
    - !append-once Items.otsstats_mag
    - !append-once Items.otsstats_rof
    - !append-once Items.otsstats_armor
    - !append-once Items.otsstats_recoil
  appearanceResourceName: ots_app
  ammo: Ammo.RifleAmmo
  audioName: wea_set_pulsar
  quality: Quality.Rare
  displayName: ots_name
  localizedDescription: ots_description
  visualTags:
   - Default
  hudIcon:
    atlasResourcePath: ots\icon\ots_hud.inkatlas
    atlasPartName: slot_01
  icon:  
    atlasResourcePath: ots\icon\ots.inkatlas
    atlasPartName: slot_01
  slotPartList:
    - Items.Base_ots_inline1
    - Items.Base_ots_inline3
    - Items.Base_ots_inline5
    - Items.Base_ots_inline7
    - Items.HandgunPossibleScopesList
    - Items.RangedWeaponPossibleMuzzleList
    - Items.RiflePossibleMuzzleBrakeList
    - Items.GradPossibleScopesList
    - Items.NekomataPossibleScopesList
    - Items.RiflePossibleScopesList
  slotPartListPreset:
    - Items.Preset_ots_inline0
    - Items.Preset_ots_inline1
    - Items.Preset_ots_inline2
    - Items.Preset_ots_inline3
    
Items.Base_ots_inline1:
