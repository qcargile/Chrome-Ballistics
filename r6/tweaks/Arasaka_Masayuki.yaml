  defaultFire: Attacks.yuki_ping_inline1
  
Attacks.yuki_ping_inline1:
  $type: gamedataRangedAttack_Record
  NPCAttack: Attacks.NPCSmartBullet
  NPCTimeDilated: Attacks.NPCSmartBullet
  playerAttack: Attacks.yuki_ping_inline2
  playerTimeDilated: Attacks.yuki_ping_inline2

Attacks.yuki_ping_inline2:
  $type: gamedataAttack_Projectile_Record
  projectileTemplateName: smart_bullet_high
  attackType: AttackType.Ranged
  className: Attack_Projectile
  explosionDamageVSVehicles: -1
  hitReactionSeverityMax: -1
  hitReactionSeverityMin: -1
  playerIncomingDamageMultiplier: 1
  range: 200
  useDefaultAimData: False
  userDataPath: Attacks.SmartBullet
  velocity: 0
  hitFlags: []
  staminaCost:
    - Attacks.Bullet_Projectile_inline0
    - Attacks.Bullet_Projectile_inline1
    - Attacks.Bullet_Projectile_inline2
    - Attacks.Bullet_Projectile_inline3
    - Attacks.Bullet_Projectile_inline4
  statModifiers:
    - AttackModifier.BaseAlliedDamage
    - AttackModifier.PhysicalAlliedDamage
    - AttackModifier.ElectricAlliedDamage
    - AttackModifier.ThermalAlliedDamage
    - AttackModifier.ChemicalAlliedDamage
  statusEffects:   
  -   $type: StatusEffectAttackData
      statusEffect: BaseStatusEffect.PingMarkStatusEffect
      applyImmediately: true  
  hitCooldown: 0.100000001
  gravitySimulation: 0


BaseStatusEffect.PingMarkStatusEffect:
  $type: gamedataStatusEffect_Record
  SFX: []
  

