Items.xm25stats_aimfov:
  $type: gamedataConstantStatModifier_Record
  value: -0.42
  modifierType: Additive
  statType: BaseStats.AimOffset
  
Items.xm25stats_mag:
  $type: gamedataConstantStatModifier_Record
  value: -1
  modifierType: Additive
  statType: BaseStats.MagazineCapacityBase  
  
Items.xm25stats_range1:
  $type: gamedataConstantStatModifier_Record
  value: 500
  modifierType: Additive
  statType: BaseStats.MaximumRange  
  
Items.xm25stats_range2:
  $type: gamedataConstantStatModifier_Record
  value: 450
  modifierType: Additive
  statType: BaseStats.EffectiveRange  
  
Items.xm25stats_dismember:
  $type: gamedataConstantStatModifier_Record
  value: 200
  modifierType: Multiplier
  statType: BaseStats.HitDismembermentFactor
  
Items.xm25stats_damage:
  $type: gamedataConstantStatModifier_Record
  value: 20
  modifierType: Additive
  statType: BaseStats.DPS
  
Items.xm25stats_reload:
  $type: gamedataConstantStatModifier_Record
  value: -1
  modifierType: Additive
  statType: BaseStats.EmptyReloadTime

  
  
Attacks.xm25_explosive:
    $base: Attacks.Bullet_GameEffect
    explosionAttack:
        $base: Attacks.ExplosionEnormous
        playerIncomingDamageMultiplier: 0.20
        effectName: weapon_explosions
        effectTag: bullet_explosion_medium
        range: 8.0
        statModifiers:
        -   $type: CombinedStatModifier
            refStat: BaseStats.DamagePerHit
            statType: BaseStats.ThermalDamage
            modifierType: Additive
            refObject: Owner
            value: 3.0
        hitFlags:
        -   !append-once DeviceExplosionAttack
        -   !append-once DetonateGrenades
        -   !append-once BulletExplosion
        hitReactionSeverityMin: 2
        explosionDamageVSVehicles: 100.0
        statusEffects:
        -   $type: StatusEffectAttackData
            statusEffect: BaseStatusEffect.EpicBurnGrenade
            resistPool: BaseStatPools.BurningTrigger
            applyImmediately: true
            

Attacks.xm25attack1:
    $type: RangedAttack
    playerAttack: Attacks.xm25_explosive
    playerTimeDilated: Attacks.xm25_explosive
    
Attacks.xm25attacks:
    $type: RangedAttackPackage
    defaultFire: Attacks.xm25attack1
  

  
  
